[project]
name = "audioshake"
description = "Python client and CLI for the AudioShake API: stem separation, dialogue isolation, transcription and alignment"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AudioShake", email = "support@audioshake.ai" }]
keywords = ["audioshake", "audio", "stem separation", "source separation", "transcription", "lyrics", "speech"]
dynamic = ["version"]
dependencies = [
    "click>=8.2",
    "httpx>=0.27",
    "rich>=13.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://github.com/audioshake/audioshake-python"
Documentation = "https://developer.audioshake.ai"
Changelog = "https://github.com/audioshake/audioshake-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/audioshake/audioshake-python/issues"

[project.scripts]
audioshake = "audioshake.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/audioshake/_version.py"

# No wheel `packages` setting: hatchling finds src/audioshake on its own.

[tool.hatch.build.targets.sdist]
# What a consumer of the package needs, and nothing else: no agent
# instructions, no design notes, no CI or editor configuration.
# Leading slashes anchor these at the project root: hatchling matches
# gitignore-style, so a bare name would match at any depth.
include = [
    "/src/audioshake",
    "/tests",
    "/docs/cli.md",
    "/docs/library.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Builds on ruff's default rules rather than replacing them. Anything the code
# relies on is listed here, since the default set changes between releases.
extend-select = [
    "E",    # pycodestyle errors
    "B",    # bugbear: likely bugs
    "I",    # import sorting
    "UP",   # pyupgrade: syntax for the oldest supported Python
    "TID",  # tidy imports: no relative imports that climb to a parent package
    "SIM",  # simplifications
    "RUF",  # ruff's own rules
    "PTH",  # pathlib over os.path and open()
    "BLE",  # no blind `except Exception`
    "N",    # PEP 8 naming
    "C4",   # comprehensions
    "RET",  # return statements
    "D",    # docstrings, on the library's public API (see per-file-ignores)
    "DTZ",  # naive datetimes; a default rule before ruff 0.17, so keep it on
]
ignore = [
    "E501", # line length is the formatter's job
    "D105", # magic methods document themselves
    "D107", # __init__ arguments are documented on the class, as Google style does
]

[tool.ruff.lint.per-file-ignores]
# Docstrings are for the library's public API. The CLI is documented by --help
# and docs/cli.md, and tests by their names.
"src/audioshake/cli/**" = ["D"]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/audioshake", "tests/typing"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

