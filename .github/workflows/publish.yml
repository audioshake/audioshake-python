name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same lint, type, test and packaging checks CI runs on main, run on the
  # tagged commit. Its package job builds the dist, verifies it and uploads it
  # as the `dist` artifact, which is what the publish job below uploads to PyPI.
  checks:
    uses: ./.github/workflows/ci.yml

  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history and every branch, so the step below can see main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: false
      - name: Check the tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag ${GITHUB_REF_NAME} points at $GITHUB_SHA, which is not on main"
            exit 1
          }
      - name: Check the tag matches the package version
        run: |
          version="$(uv run --no-project python -c 'import re,pathlib;print(re.search(r"__version__ = \"(.+)\"", pathlib.Path("src/audioshake/_version.py").read_text()).group(1))')"
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - name: Check the changelog entry for this version is dated
        run: |
          uv run --no-project python - <<'EOF'
          import os, pathlib, re, sys
          from datetime import date

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          heading = re.search(rf"^## \[{re.escape(version)}\].*$", changelog, re.M)
          if heading is None:
              sys.exit(f"CHANGELOG.md has no heading for {version}")
          # Keep a Changelog: `## [X.Y.Z] - YYYY-MM-DD`, dated before tagging.
          dated = re.fullmatch(
              rf"## \[{re.escape(version)}\] - (\d{{4}}-\d{{2}}-\d{{2}})\s*", heading.group(0)
          )
          try:
              date.fromisoformat(dated.group(1) if dated else "")
          except ValueError:
              sys.exit(f"CHANGELOG.md heading for {version} needs a YYYY-MM-DD date: {heading.group(0)}")
          EOF

  publish:
    needs: [checks, release-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/audioshake
    permissions:
      contents: read
      id-token: write   # trusted publishing; no API token needed
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
